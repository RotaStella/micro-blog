<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Blog - Connexion</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-bg-glow"></div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">✦</div>
        <a href="#" class="logo-title">Micro<span>Blog</span></a>
        <h1>Bienvenue sur Micro-Blog</h1>
        <p>Connectez-vous pour continuer</p>
      </div>

      <div id="messageBox" class="message-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="votre.email@exemple.com" required>
        </div>

        <div class="form-group">
          <label for="motDePasse">Mot de passe</label>
          <input type="password" id="motDePasse" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-auth">Se connecter</button>
      </form>

      <div class="auth-footer">
        <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
      </div>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
